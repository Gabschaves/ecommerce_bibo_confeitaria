
server:
  port: 8080

spring:
  application:
    name: cookie-shop-api

  datasource:
    url: jdbc:postgresql://localhost:5432/cookie_db
    username: admin
    password: adminpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:

      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: adminpassword

springdoc:
  swagger-ui:
    path: /swagger-ui.html #http://localhost:8080/swagger-ui.html
  api-docs:
    path: /v3/api-docs
